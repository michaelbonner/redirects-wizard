<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Something went wrong | Redirects Wizard</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
            }

            body {
                min-width: 320px;
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                flex-direction: column;
                background: #fafafa;
                color: #18181b;
                font-family:
                    "Inter Variable",
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }

            header {
                border-bottom: 1px solid #e4e4e7;
                background: #ffffff;
            }

            .container {
                width: 100%;
                max-width: 72rem;
                margin: 0 auto;
                padding: 0.875rem 1rem;
            }

            .brand {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 1rem;
                line-height: 1.5rem;
                font-weight: 600;
                color: #09090b;
                text-decoration: none;
            }

            .brand img {
                width: 1.75rem;
                height: 1.75rem;
            }

            main {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 6rem 1rem;
            }

            .content {
                display: flex;
                flex-direction: column;
                align-items: center;
                max-width: 28rem;
                text-align: center;
            }

            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 4rem;
                height: 4rem;
                border: 1px solid #e4e4e7;
                border-radius: 9999px;
                background: #ffffff;
                color: #a1a1aa;
            }

            .icon svg {
                width: 1.75rem;
                height: 1.75rem;
            }

            .status {
                margin: 2rem 0 0;
                font-size: 0.875rem;
                font-weight: 500;
                font-variant-numeric: tabular-nums;
                color: #71717a;
            }

            h1 {
                margin: 0.5rem 0 0;
                font-size: 1.5rem;
                font-weight: 600;
                line-height: 2rem;
                letter-spacing: -0.025em;
                color: #09090b;
                text-wrap: balance;
            }

            .lead {
                max-width: 24rem;
                margin: 0.75rem 0 0;
                font-size: 1rem;
                line-height: 1.625;
                color: #52525b;
                text-wrap: pretty;
            }

            .actions {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
                width: 100%;
                margin-top: 2rem;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.375rem;
                width: 100%;
                height: 2.25rem;
                padding: 0 0.875rem;
                border-radius: 0.5rem;
                font: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                text-decoration: none;
                white-space: nowrap;
                cursor: pointer;
                transition: background-color 150ms;
            }

            .button svg {
                width: 1rem;
                height: 1rem;
            }

            .button:focus-visible {
                outline: none;
                box-shadow: 0 0 0 3px rgba(144, 161, 185, 0.5);
            }

            .primary {
                border: 1px solid transparent;
                background: #007595;
                color: #ecfeff;
            }

            .primary:hover {
                background: rgba(0, 117, 149, 0.8);
            }

            .outline {
                border: 1px solid #e4e4e7;
                background: #ffffff;
                color: #18181b;
            }

            .outline:hover {
                background: #f4f4f5;
            }

            @media (min-width: 640px) {
                .container {
                    padding-left: 1.5rem;
                    padding-right: 1.5rem;
                }

                main {
                    padding-left: 1.5rem;
                    padding-right: 1.5rem;
                }

                .actions {
                    flex-direction: row;
                    justify-content: center;
                    width: auto;
                }

                .button {
                    width: auto;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .button {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container">
                <a class="brand" href="/">
                    <img src="/favicon.svg" alt="" width="28" height="28" />
                    Redirects Wizard
                </a>
            </div>
        </header>

        <main>
            <div class="content">
                <div class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M6 10H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"
                        />
                        <path
                            d="M6 14H4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2"
                        />
                        <path d="M6 6h.01" />
                        <path d="M6 18h.01" />
                        <path d="m13 6-4 6h6l-4 6" />
                    </svg>
                </div>

                <p class="status">%sveltekit.status%</p>
                <h1>Something went wrong</h1>
                <p class="lead">
                    We ran into an unexpected problem on our end. Please try again in a moment.
                </p>

                <div class="actions">
                    <button class="button primary" type="button" onclick="location.reload()">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                            <path d="M21 3v5h-5" />
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                            <path d="M8 16H3v5" />
                        </svg>
                        Try again
                    </button>
                    <a class="button outline" href="/">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                            <path
                                d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                            />
                        </svg>
                        Back to home
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
