name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The official Bun adapter enforces Bun >= 1.4 (it calls
          # Bun.semver.order during the build), and the build only runs under
          # Bun at all because the adapter uses Bun.file and Bun.CryptoHasher.
          # Pinned so CI cannot silently drift onto an older runtime.
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          version: 0.1.24
          run-install: false

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp lint
