name: Diagnose production routing

on:
  pull_request:
    branches: [master]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query Dokploy for production app state
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          api() {
            local path="$1" params="$2"
            echo "=== GET $path?$params ==="
            curl --silent --show-error --max-time 60 \
              -H "x-api-key: ${DOKPLOY_API_KEY}" -H "accept: application/json" \
              "${DOKPLOY_URL}/api/${path}?${params}" | head -c 4000
            echo
          }
          api "domain.byApplicationId" "applicationId=${DOKPLOY_APPLICATION_ID}"
          api "application.one" "applicationId=${DOKPLOY_APPLICATION_ID}&includeType=false" \
            | sed -E 's/("env":")[^"]*/\1<REDACTED>/g'
          api "deployment.getList" "applicationId=${DOKPLOY_APPLICATION_ID}"
